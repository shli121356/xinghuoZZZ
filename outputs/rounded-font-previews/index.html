<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圆润字体预览</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #fff2d6;
      background: #100905;
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }
    header {
      padding: 28px min(5vw, 56px) 18px;
      border-bottom: 1px solid rgba(255, 208, 106, 0.16);
      background: linear-gradient(135deg, rgba(255, 106, 26, 0.16), rgba(0, 0, 0, 0));
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 900; }
    p { margin: 10px 0 0; color: #cdbb9e; line-height: 1.7; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      padding: 22px min(5vw, 56px) 40px;
    }
    .card {
      color: inherit;
      text-decoration: none;
      border: 1px solid rgba(255, 208, 106, 0.22);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.035);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.24);
    }
    .card strong { display: block; padding: 14px 16px 2px; font-size: 18px; font-weight: 900; }
    .card span { display: block; padding: 0 16px 14px; color: #cdbb9e; font-size: 13px; line-height: 1.55; }
    iframe { width: 100%; height: 430px; border: 0; display: block; background: #0d0907; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } iframe { height: 520px; } }
  </style>
</head>
<body>
  <header>
    <h1>圆润字体预览</h1>
    <p>这组只比较字形圆润程度，颜色和页面风格保持一致。点击卡片可打开完整页面。</p>
  </header>
  <main class="grid"><a class="card" href="01-youyuan.html">
      <strong>01 原生幼圆</strong>
      <span>最接近你说的幼圆，字形圆、柔和、亲切。</span>
      <iframe src="01-youyuan.html" loading="lazy"></iframe>
    </a>
<a class="card" href="02-yuanhei.html">
      <strong>02 圆黑清晰</strong>
      <span>圆润但更清晰，适合正式主页，阅读感更稳。</span>
      <iframe src="02-yuanhei.html" loading="lazy"></iframe>
    </a>
<a class="card" href="03-yueyuan.html">
      <strong>03 悦圆柔字</strong>
      <span>更软、更有亲和力，标题像圆润招牌字。</span>
      <iframe src="03-yueyuan.html" loading="lazy"></iframe>
    </a>
<a class="card" href="04-chuangcu-yuan.html">
      <strong>04 创粗圆</strong>
      <span>最厚实的圆体，字形圆胖，存在感最强。</span>
      <iframe src="04-chuangcu-yuan.html" loading="lazy"></iframe>
    </a></main>
</body>
</html>
