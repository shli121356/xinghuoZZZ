<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星火中转站字体预览</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #fff2d6;
      background: #100905;
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }
    header {
      padding: 28px min(5vw, 56px) 18px;
      border-bottom: 1px solid rgba(255, 208, 106, 0.16);
      background: linear-gradient(135deg, rgba(255, 106, 26, 0.16), rgba(0, 0, 0, 0));
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 900;
    }
    p {
      margin: 10px 0 0;
      color: #cdbb9e;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      padding: 22px min(5vw, 56px) 40px;
    }
    .card {
      color: inherit;
      text-decoration: none;
      border: 1px solid rgba(255, 208, 106, 0.22);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.035);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.24);
    }
    .card strong {
      display: block;
      padding: 14px 16px 2px;
      font-size: 18px;
      font-weight: 900;
    }
    .card span {
      display: block;
      padding: 0 16px 14px;
      color: #cdbb9e;
      font-size: 13px;
      line-height: 1.55;
    }
    iframe {
      width: 100%;
      height: 430px;
      border: 0;
      display: block;
      transform-origin: 0 0;
      background: #0d0907;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      iframe { height: 520px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>星火中转站字体预览</h1>
    <p>点击任意卡片打开完整页面。当前只是预览，不会覆盖正式首页。</p>
  </header>
  <main class="grid">
    <a class="card" href="01-soft-ember.html">
      <strong>01 软圆火光</strong>
      <span>最圆润亲和，标题厚实但不压迫，适合默认首页。</span>
      <iframe src="01-soft-ember.html" loading="lazy"></iframe>
    </a>
<a class="card" href="02-molten-sign.html">
      <strong>02 熔金招牌</strong>
      <span>更像发光招牌，标题有描边和熔金层次，视觉冲击更强。</span>
      <iframe src="02-molten-sign.html" loading="lazy"></iframe>
    </a>
<a class="card" href="03-clear-rounded.html">
      <strong>03 清晰圆体</strong>
      <span>最清楚耐看，偏产品感，信息密度和可读性更好。</span>
      <iframe src="03-clear-rounded.html" loading="lazy"></iframe>
    </a>
<a class="card" href="04-spark-poster.html">
      <strong>04 星火海报</strong>
      <span>更有海报感，标题饱满醒目，适合想要更强记忆点。</span>
      <iframe src="04-spark-poster.html" loading="lazy"></iframe>
    </a>
  </main>
</body>
</html>
